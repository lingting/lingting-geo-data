name: Sync upstream data

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          chmod a+x ./bin/sync-linux-amd64
          ./bin/sync-linux-amd64
      - run: |
          if git diff --quiet -- sources/ generated/; then
            exit 0
          fi
          git config user.email "sunlisten.gzm@foxmail.com"
          git config user.name "lingting ci"
          git add sources/ generated/
          git commit -m "chore(data): sync upstream data"
          git push
